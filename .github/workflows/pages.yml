name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/cache@v4
        with:
          path: ~/renpy-sdk
          key: renpy-sdk-web-${{ runner.os }}-${{ hashFiles('RENPY_VERSION') }}
      - name: Fetch Ren'Py SDK + web support
        run: echo "SDK=$(scripts/fetch_renpy.sh --web | tail -1)" >> "$GITHUB_ENV"

      - name: Lint
        run: '"$SDK/renpy.sh" . lint --error-code'

      - name: Web build (playtest, with Dev tools)
        run: |
          echo "Playtest build: enables the Dev button (see game/playtest.rpy)." > game/playtest_enabled.txt
          "$SDK/renpy.sh" "$SDK/launcher" web_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/web-build"
          test -f web-build/index.html
          touch web-build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
